<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AstroBit — Jogo Espacial de Programação para Crianças</title>
  <meta name="description" content="Aprenda lógica de programação, loops, sensores, funções e código real (JavaScript e Python) montando quebra-cabeças para guiar o robô AstroBit pelo espaço!" />
  <meta property="og:title" content="AstroBit — Jogo Espacial de Programação para Crianças" />
  <meta property="og:description" content="7 mundos, 42 fases (incl. Planeta Congelado com gelo e baterias), Modo Arcade Infinito, Robô Fantasma, 5 Drones Companheiros, Passaporte PNG, Lab de Games AAA (7 simuladores), Missão Diária, 15 Medalhas e código JS/Python ao vivo!" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lucasvalequeiroz.github.io/astrobit/" />
  <meta property="og:image" content="https://lucasvalequeiroz.github.io/astrobit/assets/og-preview.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0b1126" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-512.svg" />
  <link rel="icon" href="assets/icon-512.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="src/css/styles.css?v=7.5" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">🤖</span>
        <div class="brand-text">
          <strong class="brand-name">AstroBit</strong>
          <span id="level-badge" class="level-pill">Fase 1-1</span>
        </div>
      </div>

      <nav class="topbar-actions" aria-label="Game controls">
        <span id="total-stars-pill" class="stars-pill">⭐ 0 / 126</span>
        <button id="btn-arcade" class="nav-btn nav-btn-arcade" type="button" title="Modo Arcade Infinito">🕹️ <span id="arcade-btn-label">Arcade</span></button>
        <button id="btn-daily" class="nav-btn nav-btn-daily" type="button" title="Missão Diária">🔥 <span id="daily-btn-label">Diária</span></button>
        <button id="btn-engine-lab" class="nav-btn nav-btn-lab" type="button" title="Laboratório de Games AAA">🧪 <span>Lab AAA</span></button>
        <button id="btn-badges" class="nav-btn" type="button" title="Medalhas Espaciais">🏆 <span id="badges-count">0/15</span></button>
        <button id="btn-story" class="nav-btn" type="button">📖 <span data-i18n="navStory">História</span></button>
        <button id="btn-levels" class="nav-btn" type="button">🗺️ <span data-i18n="navLevels">Mapa</span></button>
        <button id="btn-workshop" class="nav-btn" type="button">🛠️ <span data-i18n="navWorkshop">Oficina</span></button>
        <button id="btn-garage" class="nav-btn" type="button">🎨 <span data-i18n="navGarage">Garagem</span></button>
        <button id="btn-code-toggle" class="nav-btn" type="button">👀 <span data-i18n="navCode">Ver Código</span></button>
        <button id="btn-music" class="nav-btn nav-icon-btn" type="button" aria-label="Music" title="Música Espacial">🎵</button>
        <button id="btn-sound" class="nav-btn nav-icon-btn" type="button" aria-label="Sound">🔊</button>
        <button id="btn-lang" class="nav-btn nav-icon-btn" type="button">PT</button>
      </nav>
    </div>
  </header>

  <main class="game-layout">
    <!-- LEFT: Interactive Space Stage & Living Mascot -->
    <section class="stage-column">
      <div class="mission-banner">
        <div class="mission-title-row">
          <h1 id="mission-title">Primeiros Passos</h1>
          <div class="mission-stats-group">
            <button id="btn-xp-quests" class="xp-level-pill" type="button" title="Nível de Piloto & Missões Relâmpago (Quests)">
              <span id="xp-level-label">⚡ Lv.1</span>
              <span class="xp-mini-track"><span id="xp-mini-fill" class="xp-mini-fill" style="width:0%"></span></span>
            </button>
            <span id="crystals-pill" class="mission-stat">💎 0/1</span>
          </div>
        </div>
        <div class="mascot-row">
          <button id="mascot-avatar-btn" class="mascot-avatar-btn" type="button" title="Clique no AstroBit!">🤖</button>
          <div id="mascot-bubble" class="mascot-bubble" role="status" aria-live="polite"></div>
        </div>
      </div>

      <div id="arcade-hud-bar" class="arcade-hud-bar hidden" aria-live="polite">
        <span id="arcade-shields" class="arcade-chip arcade-shields">❤️❤️❤️</span>
        <span id="arcade-round" class="arcade-chip">⚡ Fase #1</span>
        <span id="arcade-combo" class="arcade-chip arcade-combo">🔥 ×1</span>
        <span id="arcade-score" class="arcade-chip arcade-score">🏆 0 pts</span>
        <button id="btn-arcade-exit" class="arcade-exit-btn" type="button">✕ Sair</button>
      </div>

      <div id="canvas-frame" class="canvas-frame">
        <canvas id="game-canvas" aria-label="AstroBit game board"></canvas>

        <!-- ⏪ Time Machine: time-travel debugger scrubber -->
        <div id="time-machine-bar" class="time-machine-bar hidden" role="group" aria-label="Máquina do Tempo / Time Machine">
          <span id="tm-label" class="tm-label" aria-live="polite">⏳ Passo 0/0</span>
          <button id="tm-back" class="tm-btn" type="button" title="Voltar no tempo (←)" aria-label="Rewind">⏪</button>
          <div class="tm-track-wrap">
            <div id="tm-markers" class="tm-markers" aria-hidden="true"></div>
            <input id="tm-slider" class="tm-slider" type="range" min="0" max="1" value="0" step="1" aria-label="Linha do tempo / Timeline" />
          </div>
          <button id="tm-fwd" class="tm-btn" type="button" title="Avançar no tempo (→)" aria-label="Fast-forward">⏩</button>
        </div>

        <!-- Victory celebration overlay -->
        <div id="win-overlay" class="win-overlay hidden" role="dialog" aria-live="polite">
          <div class="win-card">
            <div id="win-stars" class="win-stars"></div>
            <h2 id="win-title"></h2>
            <p id="win-story-note" class="win-story-note"></p>
            <p id="win-sub" class="win-sub"></p>
            <div class="win-actions">
              <button id="win-replay-btn" class="btn btn-secondary" type="button">🔄 Jogar de novo</button>
              <button id="win-challenge-btn" class="btn btn-secondary hidden" type="button">👻 Desafiar Amigo</button>
              <button id="win-next-btn" class="btn btn-run" type="button">🚀 Voar p/ Próxima Base</button>
            </div>
          </div>
        </div>
      </div>

      <div class="controls-bar">
        <button id="btn-run" class="btn btn-run" type="button" title="Rodar / Parar (Espaço)">▶️ <span data-i18n="btnRun">Rodar</span></button>
        <button id="btn-step" class="btn btn-step" type="button" title="Executar 1 passo (S)">⏭️ <span data-i18n="btnStep">1 Passo</span></button>
        <button id="btn-hint" class="btn btn-hint" type="button" title="Mostrar próxima peça">💡 <span data-i18n="btnHint">Dica</span></button>
        <button id="btn-ghost" class="btn btn-secondary btn-ghost-toggle hidden" type="button" title="Ligar/Desligar Robô Fantasma">👻 <span id="ghost-btn-label">Fantasma</span></button>
        <button id="btn-xray" class="btn btn-secondary btn-xray-toggle" type="button" title="Raio-X Engine AAA (A* + Colliders + FPS)">⚡ <span id="xray-btn-label">Raio-X</span></button>
        <button id="btn-reset" class="btn btn-secondary" type="button" title="Reiniciar tabuleiro (R)">🔄 <span data-i18n="btnReset">Reiniciar</span></button>
        <button id="btn-speed" class="btn btn-secondary" type="button" title="Velocidade">🚀 Normal</button>
      </div>
    </section>

    <!-- RIGHT: 4-Direction Jigsaw Palette, Interlocking Puzzle Board & Live Code Peek -->
    <section class="editor-column">
      <div id="guided-tutorial-bar" class="guided-tutorial-bar hidden" role="status" aria-live="polite">
        <span id="tutorial-icon" class="tutorial-icon" aria-hidden="true">👆</span>
        <div class="tutorial-copy">
          <div id="tutorial-dots" class="tutorial-dots" aria-hidden="true"></div>
          <p id="tutorial-msg" class="tutorial-msg"></p>
        </div>
        <button id="btn-tutorial-dismiss" class="tutorial-dismiss-btn" type="button" title="Fechar guia">✕</button>
      </div>

      <div class="panel palette-panel">
        <div class="panel-head">
          <h2 data-i18n="paletteTitle">🧩 Peças do Quebra-Cabeça</h2>
          <span id="blocks-counter" class="counter-pill">0 peças</span>
        </div>
        <div id="block-palette" class="block-palette"></div>
      </div>

      <div class="panel workspace-panel">
        <div class="panel-head">
          <h2 data-i18n="workspaceTitle">Montagem do Programa</h2>
          <div class="head-actions">
            <button id="btn-undo" class="mini-text-btn" type="button" title="Desfazer (Ctrl+Z)">↩️ <span data-i18n="btnUndo">Desfazer</span></button>
            <button id="btn-clear" class="mini-text-btn danger" type="button" title="Limpar programa">🗑️ <span data-i18n="btnClear">Limpar</span></button>
          </div>
        </div>
        <div id="block-workspace" class="block-workspace"></div>
      </div>

      <div id="code-peek-panel" class="panel code-peek-panel hidden">
        <div class="panel-head">
          <h2>👀 <span data-i18n="codePeekTitle">Código Real ao Vivo</span></h2>
          <div class="code-lang-tabs">
            <button type="button" class="tab-btn active" data-code-lang="js">JavaScript</button>
            <button type="button" class="tab-btn" data-code-lang="python">Python</button>
          </div>
        </div>
        <div id="code-peek-lines" class="code-peek-lines"></div>
      </div>
    </section>
  </main>

  <div id="achievement-toast-stack" class="achievement-toast-stack" aria-live="polite"></div>
  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true"></div>

  <script type="module" src="src/app.js?v=7.4"></script>
</body>
</html>
